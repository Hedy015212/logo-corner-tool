<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo 角标工具</title>
  <style>
    :root{--ink:#162235;--muted:#657387;--line:#dce3eb;--blue:#1769e0}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:15px/1.5 "Microsoft YaHei","PingFang SC",Arial,sans-serif}main{max-width:1180px;margin:auto;padding:32px 20px 48px}h1{margin:0 0 6px;font-size:28px}.intro{margin:0 0 24px;color:var(--muted)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(26,49,79,.06)}.panel{padding:20px;position:sticky;top:16px}.group+.group{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}h2{margin:0 0 12px;font-size:16px}label{display:block;margin:11px 0 6px;font-weight:600}input[type=file]{display:block;width:100%;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--blue)}.readout{float:right;color:var(--blue);font-weight:600}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{display:flex;gap:7px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-weight:400;margin:0}.choice:has(input:checked){border-color:var(--blue);background:#edf5ff}.preview{min-height:480px;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-weight:700}.card-head small{color:var(--muted);font-weight:400}.canvas-wrap{display:grid;place-items:center;background:repeating-conic-gradient(#edf0f3 0 25%,#fff 0 50%) 50%/18px 18px;min-height:160px;overflow:hidden}canvas{display:block;width:100%;height:auto;cursor:grab;touch-action:none}.card-controls{padding:0 12px 4px}.card-controls label{font-size:13px;margin:9px 0 3px}.card-controls output{float:right;color:var(--blue)}.card-hint{margin:8px 12px 0;color:var(--muted);font-size:12px}button{margin:10px 12px 12px;width:calc(100% - 24px);padding:9px 12px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}.empty{display:grid;place-items:center;min-height:440px;color:var(--muted);text-align:center}.hint{color:var(--muted);font-size:13px;margin:8px 0 0}@media(max-width:800px){main{padding:22px 14px 32px}.layout{grid-template-columns:1fr}.panel{position:static}.preview{min-height:0}.grid{grid-template-columns:1fr}.empty{min-height:260px}}
  </style>
</head>
<body>
  <main>
    <h1>Logo 角标工具</h1><p class="intro">上传一张底图后，会同时生成 6 种 Logo 效果。统一调整位置、大小和边距后，可分别下载。</p>
    <div class="layout"><section class="panel" aria-label="设置">
      <div class="group"><h2>上传底图</h2><label for="photo">选择图片</label><input id="photo" type="file" accept="image/*"><p class="hint">Logo 已内置为你提供的 6 个款式。</p></div>
      <div class="group"><h2>角标设置</h2><div class="choices"><label class="choice"><input type="radio" name="position" value="left" checked>左上角</label><label class="choice"><input type="radio" name="position" value="right">右上角</label></div><label for="size">统一 Logo 宽度 <span class="readout" id="sizeValue">18%</span></label><input id="size" type="range" min="5" max="50" value="18"><label for="padding">统一边距 <span class="readout" id="paddingValue">1%</span></label><input id="padding" type="range" min="0" max="15" value="1"><p class="hint">下方每个 Logo 也可单独调整。</p></div>
    </section><section class="preview" aria-label="六种效果预览"><div class="empty" id="empty">请上传一张底图<br>系统会自动展示 6 种 Logo 效果</div><div class="grid" id="grid" hidden></div></section></div>
  </main>
  <script>
    const logoOptions=[{name:'SunArk 彩色（白底）',file:'sunark-color-whitebg.jpg'},{name:'SunEvo 蓝色（白底）',file:'sunevo-blue-whitebg.jpg'},{name:'SunEvo × SunArk 彩色',file:'combo-color.png'},{name:'SunArk 白色',file:'sunark-white.png'},{name:'SunEvo 白色',file:'sunevo-white.png'},{name:'SunEvo × SunArk 白色',file:'combo-white.png'}];
    const photoInput=document.getElementById('photo'),size=document.getElementById('size'),padding=document.getElementById('padding'),empty=document.getElementById('empty'),grid=document.getElementById('grid');let photo=null;const logos=[],settings=logoOptions.map(()=>({size:18,padding:1,x:null,y:null}));
    function imageFrom(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}function labels(){document.getElementById('sizeValue').textContent=size.value+'%';document.getElementById('paddingValue').textContent=padding.value+'%'}
    function buildCards(){grid.innerHTML=logoOptions.map((item,i)=>`<article class="card"><div class="card-head"><span>${item.name}</span><small>效果 ${i+1}</small></div><div class="canvas-wrap"><canvas id="canvas-${i}" aria-label="${item.name} 效果预览"></canvas></div><p class="card-hint">按住 Logo 可拖动到任意位置</p><div class="card-controls"><label>单独 Logo 宽度 <output id="card-size-value-${i}">${settings[i].size}%</output></label><input type="range" data-size="${i}" min="5" max="50" value="${settings[i].size}"><label>单独边距 <output id="card-padding-value-${i}">${settings[i].padding}%</output></label><input type="range" data-padding="${i}" min="0" max="15" value="${settings[i].padding}"></div><button type="button" data-download="${i}">下载此效果</button></article>`).join('');grid.querySelectorAll('[data-download]').forEach(b=>b.addEventListener('click',()=>downloadImage(Number(b.dataset.download))));grid.querySelectorAll('[data-size]').forEach(x=>x.addEventListener('input',()=>{const i=Number(x.dataset.size);settings[i].size=Number(x.value);document.getElementById('card-size-value-'+i).textContent=x.value+'%';renderOne(i)}));grid.querySelectorAll('[data-padding]').forEach(x=>x.addEventListener('input',()=>{const i=Number(x.dataset.padding);settings[i].padding=Number(x.value);document.getElementById('card-padding-value-'+i).textContent=x.value+'%';renderOne(i)}));logoOptions.forEach((_,i)=>enableDrag(document.getElementById('canvas-'+i),i))}
    function logoBox(i){const logo=logos[i],w=photo.naturalWidth*settings[i].size/100,h=w*logo.naturalHeight/logo.naturalWidth,pad=Math.min(photo.naturalWidth,photo.naturalHeight)*settings[i].padding/100,right=document.querySelector('input[name="position"]:checked').value==='right',rawX=settings[i].x??(right?photo.naturalWidth-pad-w:pad),rawY=settings[i].y??pad;return{w,h,x:Math.max(0,Math.min(photo.naturalWidth-w,rawX)),y:Math.max(0,Math.min(photo.naturalHeight-h,rawY))}}
    function renderOne(i){const canvas=document.getElementById('canvas-'+i),ctx=canvas.getContext('2d'),logo=logos[i],box=logoBox(i);canvas.width=photo.naturalWidth;canvas.height=photo.naturalHeight;ctx.drawImage(photo,0,0);ctx.drawImage(logo,box.x,box.y,box.w,box.h)}
    function enableDrag(canvas,i){let drag=null;const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};canvas.addEventListener('pointerdown',e=>{const p=point(e),b=logoBox(i);if(p.x<b.x||p.x>b.x+b.w||p.y<b.y||p.y>b.y+b.h)return;drag={id:e.pointerId,dx:p.x-b.x,dy:p.y-b.y};canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e),b=logoBox(i);settings[i].x=Math.max(0,Math.min(canvas.width-b.w,p.x-drag.dx));settings[i].y=Math.max(0,Math.min(canvas.height-b.h,p.y-drag.dy));renderOne(i)});const stop=e=>{if(drag&&drag.id===e.pointerId){drag=null;canvas.style.cursor='grab'}};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop)}
    function renderAll(){labels();if(!photo||logos.length!==logoOptions.length)return;for(let i=0;i<logoOptions.length;i++)renderOne(i)}function downloadImage(i){const a=document.createElement('a');a.download=`logo效果-${i+1}.png`;a.href=document.getElementById('canvas-'+i).toDataURL('image/png');a.click()}
    function applyAll(key,value){settings.forEach((x,i)=>{x[key]=Number(value);const input=grid.querySelector(`[data-${key}="${i}"]`),output=document.getElementById(`card-${key}-value-${i}`);if(input)input.value=value;if(output)output.textContent=value+'%'})}photoInput.addEventListener('change',()=>{const file=photoInput.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);photo=img;empty.hidden=true;grid.hidden=false;buildCards();renderAll()};img.src=url});size.addEventListener('input',()=>{applyAll('size',size.value);renderAll()});padding.addEventListener('input',()=>{applyAll('padding',padding.value);renderAll()});document.querySelectorAll('input[name="position"]').forEach(el=>el.addEventListener('change',()=>{settings.forEach(x=>{x.x=null;x.y=null});renderAll()}));Promise.all(logoOptions.map(x=>imageFrom(x.file))).then(items=>logos.push(...items)).catch(()=>empty.textContent='Logo 文件加载失败，请确认 logos 文件夹完整保留。');labels();
  </script>
</body>
</html>
